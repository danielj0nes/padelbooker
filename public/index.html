<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Booker</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <h1>Padel Booker</h1>

      <form id="booking-form">
        <label class="wide">Club URL
          <input name="clubUrl" type="url" placeholder="https://padelmates.se/club/..." required>
        </label>

        <label>Email
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>

        <label>Date
          <input id="date" name="date" type="date" required>
        </label>
        <label>Start time
          <input name="time" type="time" step="1800" value="18:00" required>
        </label>
        <label>Duration (minutes)
          <input name="duration" type="number" min="30" max="240" step="30" value="90" required>
        </label>
        <label>Court name (optional)
          <input name="courtName" type="text" maxlength="100">
        </label>

        <label>Refresh (seconds)
          <input name="pollIntervalSeconds" type="number" min="2" max="120" value="5" required>
        </label>
        <label>Stop after (minutes)
          <input name="maxWaitMinutes" type="number" min="1" max="1440" value="120" required>
        </label>
        <label>Step pause (seconds, 0–3)
          <input name="observationDelaySeconds" type="number" min="0" max="3" step="0.25" value="1.5" required>
        </label>

        <fieldset class="wide inline">
          <legend>Browser</legend>
          <label><input type="radio" name="browserChannel" value="chrome" checked> Chrome</label>
          <label><input type="radio" name="browserChannel" value="msedge"> Edge</label>
          <label><input type="radio" name="browserChannel" value="bundled"> Playwright</label>
        </fieldset>

        <div class="wide inline options">
          <label><input id="dry-run" type="checkbox" checked> Dry run</label>
          <label><input id="show-browser" type="checkbox" checked> Show browser</label>
        </div>

        <label class="wide authorize hidden" id="authorize-row">
          <input id="authorized" type="checkbox">
          Authorize live booking and payment
        </label>

        <div id="form-error" class="error wide" role="alert" hidden></div>
        <button class="wide" type="submit">Start</button>
      </form>

      <section id="job-card" class="hidden" aria-live="polite">
        <header>
          <strong id="job-title">Starting</strong>
          <span id="status-pill">starting</span>
        </header>
        <div class="summary">
          Attempts: <b id="attempts">0</b>
          · Elapsed: <b id="elapsed">00:00</b>
          · Target: <b id="target">—</b>
        </div>
        <div id="event-log" class="event-log"></div>
        <button id="stop-job" type="button">Stop</button>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
